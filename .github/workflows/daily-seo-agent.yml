# Optional fallback scheduler: starts a Cursor Cloud Agent via API every 24h.
# Prefer native Cursor Automations (see .cursor/automations/daily-seo-prompt.md).
#
# Required repo secret:
#   CURSOR_API_KEY — from https://cursor.com/settings (API keys)
#
# If the secret is missing, the workflow no-ops successfully so Actions stays green.

name: Daily SEO Cloud Agent

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  start-seo-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Start Cursor Cloud Agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "CURSOR_API_KEY secret not set — skip API trigger."
            echo "Create a Cursor Automation instead: .cursor/automations/daily-seo-prompt.md"
            exit 0
          fi

          python3 <<'PY'
          import json, os, urllib.request

          prompt = """You are the 24-hour SEO agent for https://logbook.rocks (repo KavehRS/logbook.rocks, branch main).

          Goal: this site is Google #1 in Persian for راهنمای صعود, گزارش صعود, کوهنوردی فنی, and کوهنوردی در ایران; every published /logbook/ report is Google #1 or #2 for that climb’s queries. See _seo/ranking-targets.yml.

          Before changing anything:
          1. Read AGENTS.md
          2. Follow .cursor/skills/daily-seo-audit/SKILL.md exactly
          3. Obey .cursor/rules/seo-daily-agent.mdc and .cursor/rules/logbook-reports.mdc
          4. Refresh guidance from Google Search Central, Bing Webmaster Guidelines, and schema.org (latest public docs)

          Then audit the live site + repo (every /logbook/, /news/, /articles/ URL), confirm unique HTML per URL, review the four pillars and every report’s {peak} queries, update _seo/ranking-snapshot.md and _seo/daily-log.md, and implement only evidence-based SEO (logbook first). Do not keyword-stuff. Do not scrape Google SERPs.

          If you make verified high-confidence changes: open a PR on a cursor/*-4b4e branch and merge to main after a clean build.
          If nothing material needs changing: do not open a PR; leave a brief summary of what you checked.

          Never invent climb facts, never duplicate report prose for the same peak, never keyword-stuff, never commit secrets."""

          body = {
              "name": "Daily SEO — logbook.rocks rank #1",
              "prompt": {"text": prompt},
              "repos": [{
                  "url": "https://github.com/KavehRS/logbook.rocks",
                  "startingRef": "main",
              }],
              "autoCreatePR": True,
              "skipReviewerRequest": True,
          }
          req = urllib.request.Request(
              "https://api.cursor.com/v1/agents",
              data=json.dumps(body).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['CURSOR_API_KEY']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req) as resp:
              print(resp.read().decode())
          print("Cloud agent requested.")
          PY
