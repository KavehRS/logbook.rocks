### Site settings

title: گزارش صعود
tagline: "کاوه‌ رضائی‌شیراز"
description: >-
  گزارش برنامه‌های صعود کوهنوردی، سنگ‌نوردی و یخ‌نوردی و اخبار کوهستان
  کاوه‌ رضائی‌شیراز — منبع فارسی گزارش صعود.
  Kaveh RezaeiShiraz
  Mountaineering logbook & climbing news

lang: fa-IR
locale: fa_IR
timezone: Asia/Tehran

# Allow publishing dated logbook/news entries ahead of the climb/event date
future: true

baseurl: ""
url: "https://logbook.rocks"
email: me@kavehrs.com

# Logo used by jekyll-seo-tag (Open Graph / JSON-LD)
logo: /assets/images/logos/1/kavehrs.jpg

author:
  name: کاوه‌ رضائی‌شیراز
  twitter: kavehrs
  url: https://www.kavehrs.com/

# Social profiles for jekyll-seo-tag JSON-LD
social:
  name: Kaveh RezaeiShiraz
  links:
    - https://www.linkedin.com/in/kavehrs
    - https://github.com/kavehrs
    - https://twitter.com/kavehrs
    - https://www.facebook.com/imkavehrs
    - https://www.instagram.com/imkavehrs
    - https://www.kavehrs.com

# Twitter card settings for jekyll-seo-tag
twitter:
  username: kavehrs
  card: summary_large_image

# Social media usernames used in footer links
facebook: "imkavehrs"
instagram: "imkavehrs"
linkedin: "kavehrs"
github: "kavehrs"

highlighter: rouge
markdown: kramdown

# Tracker (Google Analytics 4 measurement ID)
analytics: G-X4V1FLGZMH

#optimization -> compress.html
compress_html:
  clippings: [html,div, p, ul, td, h1, h2, h3, h4,link, meta, footer, nav, img, header, hr, br, head, style, li, ul, ol, time, main, script, title]
  comments: ["<!-- ", " -->"]
  endings: [all]
  ignore:
    envs: [local]
  blanklines: false
  profile: false
  startings: []

collections:
  logbook:
    output: true
    permalink: /logbook/:path/
  news:
    output: true
    permalink: /news/:path/

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/logos/1/kavehrs.jpg
  - scope:
      path: "assets"
    values:
      sitemap: false
  - scope:
      path: ""
      type: logbook
    values:
      layout: post
  - scope:
      path: ""
      type: news
    values:
      layout: post

sass:
  sass_dir: /assets/css/_sass
  style: compressed

include:
  - _pages
  - _headers
  - _redirects

exclude:
  - README.md
  - LICENSE.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - _drafts
  - .cursor
  - .github
  - AGENTS.md
  - _seo
  - wrangler.toml

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-email-protect

assets:
  css:
    - "rtl.scss"
