<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/KavehRS/logbook.rocks@published/assets/css/main.css">
<style id="lb-boot-style">body>.markdown-body{opacity:0}#lb-boot{direction:rtl;font-family:Tahoma,sans-serif;text-align:center;padding:2.5rem 1rem;color:#222}</style>
<p id="lb-boot">در حال بارگذاری…</p>
<script data-cfasync="false">
(function(){
  if (window.__logbookBoot) return;
  window.__logbookBoot = true;
  var CDN = "https://cdn.jsdelivr.net/gh/KavehRS/logbook.rocks@published";
  function filePath(p){
    if (!p || p === "/") return "/index.html";
    if (p.endsWith("/")) return p + "index.html";
    var last = p.split("/").pop();
    if (last.indexOf(".") === -1) return p + "/index.html";
    return p;
  }
  function rewrite(h){
    h = h.replace(/\ssrc="\//g, ' src="' + CDN + '/');
    h = h.replace(/\ssrcset="\//g, ' srcset="' + CDN + '/');
    h = h.replace(/\sposter="\//g, ' poster="' + CDN + '/');
    h = h.replace(/url\(\//g, 'url(' + CDN + '/');
    h = h.replace(/href="\/(assets|favicon|apple-touch|android-chrome|mstile|site\.webmanifest|robots\.txt)/g, 'href="' + CDN + '/$1');
    return h;
  }
  function paint(h){
    document.open();
    document.write(rewrite(h));
    document.close();
  }
  function get(url, ms){
    var ctrl = new AbortController();
    var t = setTimeout(function(){ ctrl.abort(); }, ms);
    return fetch(url, {mode:"cors", credentials:"omit", cache:"force-cache", signal:ctrl.signal}).then(function(r){
      clearTimeout(t);
      if (!r.ok) throw new Error(String(r.status));
      return r.text();
    });
  }
  var url = CDN + filePath(location.pathname);
  get(url, 8000).then(paint).catch(function(){
    return get(url + (url.indexOf("?")>=0?"&":"?") + "t=" + Date.now(), 8000).then(paint);
  }).catch(function(e){
    var el = document.getElementById("lb-boot");
    if (el) el.textContent = "بارگذاری صفحه طول کشید. یک بار دیگر تلاش کنید.";
    console.error("logbook boot", e);
  });
})();
</script>
